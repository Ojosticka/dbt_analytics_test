version: 2

models:
  - name: src_customers
    description: "Staging model for customer details sourced from warehouse_staging.customers."
    columns:
      - name: customer_id
        description: "Primary key identifier for each customer."
        tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "A unique identifier used to track the same customer across multiple systems."

      - name: customer_zip_code_prefix
        description: "The ZIP code prefix of the customer's location."
        tests:
          - not_null

      - name: customer_city
        description: "Customer's city of residence."
        tests:
          - not_null

      - name: customer_state_acronym
        description: "Two-letter state abbreviation representing the customer's state."
        tests:
          - not_null

